[workspace]
members  = ["source/cargo-flow"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit  = "0.25.19"
ureq       = "2.12.1"

[profile.release]
lto   = true
strip = true
